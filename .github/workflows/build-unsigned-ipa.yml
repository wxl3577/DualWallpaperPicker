name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build DualWallpaperPicker iOS app
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install app icon
        run: |
          cp assets/wallpaper-icon.png DualWallpaperPicker/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify app launches in iOS Simulator
        run: |
          set -euo pipefail
          SIM_BUILD="$RUNNER_TEMP/simulator-build"
          xcodebuild \
            -project DualWallpaperPicker.xcodeproj \
            -scheme DualWallpaperPicker \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$SIM_BUILD" \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device.get("isAvailable") and device["name"].startswith("iPhone")))')"
          APP_PATH="$SIM_BUILD/Build/Products/Debug-iphonesimulator/DualWallpaperPicker.app"
          LOG_PATH="$RUNNER_TEMP/DualWallpaperPicker-simulator.log"

          xcrun simctl boot "$DEVICE_ID" || true
          # Installation readiness is not SpringBoard/launch readiness.
          # Wait for the cold-booted simulator to finish its system setup first.
          xcrun simctl bootstatus "$DEVICE_ID" -b
          INSTALLED=false
          for ATTEMPT in {1..45}; do
            if xcrun simctl install "$DEVICE_ID" "$APP_PATH"; then
              INSTALLED=true
              break
            fi
            sleep 2
          done

          if [ "$INSTALLED" != true ]; then
            echo "The simulator did not become ready within 90 seconds."
            xcrun simctl list devices
            exit 1
          fi

          xcrun simctl launch --console --terminate-running-process \
            "$DEVICE_ID" com.codex.dualwallpaperpicker --test-wallpaper-canvas >"$LOG_PATH" 2>&1 &
          CONSOLE_PID=$!
          TESTS_READY=false
          for ATTEMPT in {1..60}; do
            if grep -q 'WALLPAPER_CANVAS_TESTS_PASSED' "$LOG_PATH"; then
              TESTS_READY=true
              break
            fi
            if ! kill -0 "$CONSOLE_PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$TESTS_READY" != true ]; then
            cat "$LOG_PATH"
            echo "The app did not complete wallpaper canvas tests."
            exit 1
          fi
          sleep 8

          if ! kill -0 "$CONSOLE_PID" 2>/dev/null; then
            cat "$LOG_PATH"
            echo "The app exited during the launch smoke test."
            exit 1
          fi

          kill "$CONSOLE_PID" || true
          xcrun simctl terminate "$DEVICE_ID" com.codex.dualwallpaperpicker || true
          cat "$LOG_PATH"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project DualWallpaperPicker.xcodeproj \
            -scheme DualWallpaperPicker \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify iOS 15 compatibility metadata
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/DualWallpaperPicker.app"
          BINARY_PATH="$APP_PATH/DualWallpaperPicker"
          MINIMUM_OS="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP_PATH/Info.plist")"

          echo "Info.plist MinimumOSVersion: $MINIMUM_OS"
          if [ "$MINIMUM_OS" != "15.0" ]; then
            echo "Expected MinimumOSVersion 15.0, got $MINIMUM_OS"
            exit 1
          fi

          xcrun vtool -show-build "$BINARY_PATH" | tee "$RUNNER_TEMP/vtool-build.txt"
          if ! grep -Eq 'minos[[:space:]]+15\.0' "$RUNNER_TEMP/vtool-build.txt"; then
            echo "The compiled binary is not marked as compatible with iOS 15.0."
            exit 1
          fi

      - name: Embed TrollStore wallpaper entitlement
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/DualWallpaperPicker.app"
          codesign --force --sign - --entitlements DualWallpaperPicker/TrollStore.entitlements "$APP_PATH"
          codesign --verify --strict "$APP_PATH"
          codesign -d --entitlements :- "$APP_PATH"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/DualWallpaperPicker.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Compiled app was not found at: $APP_PATH"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/ipa"
          zip -qry "$GITHUB_WORKSPACE/DualWallpaperPicker-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: DualWallpaperPicker-unsigned-${{ github.run_number }}
          path: DualWallpaperPicker-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

