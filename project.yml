name: DualWallpaperPicker

options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  DualWallpaperPicker:
    type: application
    platform: iOS
    sources:
      - path: DualWallpaperPicker
    info:
      path: DualWallpaperPicker/Info.plist
      properties:
        CFBundleDisplayName: "双壁纸"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSPhotoLibraryAddUsageDescription: "用于把选中的锁屏和主屏壁纸保存到照片。"
        NSAppTransportSecurity:
          NSExceptionDomains:
            wallpapers.claritywallpaper.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.dualwallpaperpicker
        PRODUCT_NAME: DualWallpaperPicker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

