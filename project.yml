name: DualWallpaperPicker

options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.7.0"
    CURRENT_PROJECT_VERSION: "11"

targets:
  DualWallpaperPicker:
    type: application
    platform: iOS
    sources:
      - path: DualWallpaperPicker
    info:
      path: DualWallpaperPicker/Info.plist
      properties:
        CFBundleDisplayName: "鱼头壁纸"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSExceptionDomains:
            wallpapers.claritywallpaper.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.dualwallpaperpicker
        PRODUCT_NAME: DualWallpaperPicker
        SWIFT_OBJC_BRIDGING_HEADER: DualWallpaperPicker/WallpaperBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

