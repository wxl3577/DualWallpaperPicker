name: DualWallpaperPicker

options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DualWallpaperPicker:
    type: application
    platform: iOS
    sources:
      - path: DualWallpaperPicker
        excludes:
          - Resources
      - path: DualWallpaperPicker/Resources
        buildPhase: resources
    info:
      path: DualWallpaperPicker/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.dualwallpaperpicker
        PRODUCT_NAME: DualWallpaperPicker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic

